# TABLE_DIM_MASTER_ENUMS_001 - grounded in NEOWEALTH_DDL.sql / Neowealth_schema.xlsx
# Provenance tags preserved: [D] = declared in source, [I] = inferred,
# [C] = observed in the 2026-08-28 CSV delivery (Wealth Management data/dim_master_enums.csv).

identity:
  id: "TABLE_DIM_MASTER_ENUMS_001"
  type: "Table"
  subtype: "Dimension"
  name: "dim_master_enums"
  display_name: "Master Enums"
  description: >
    [D] DIMENSION, 10 columns. Generic key-value lookup - the 'one lookup table to
    rule them all' pattern, where every coded vocabulary lives partitioned by a
    category column. NOTHING IN THE SCHEMA LINKS IT TO THE COLUMNS IT GOVERNS.
    There is no enum_id on dim_client_master.tier, no revenue_type_id on
    client_revenue - every coded column stores a FREE-TEXT LABEL, not a foreign
    key. So this table is DOCUMENTARY, NOT ENFORCING: it records what the valid
    values are but cannot prevent an invalid one, joining to it requires fragile
    text matching, and renaming a value here will NOT update labels already
    written into the client, product and fact tables. Its most valuable use is as
    a DATA-QUALITY REFERENCE - compare SELECT DISTINCT tier against the registered
    values to detect misspellings. [C] DELIVERY DEFECT: dim_master_enums.csv is a
    byte-identical copy of dim_cmot_company_mstr.csv (25 company records with
    co_code, isin, company_name, nse_symbol ...), not an enum export. This YAML
    deliberately still describes the INTENDED enum table: none of id, type_key,
    master_category_name, name, master_type_key or is_deleted is in the CSV, so
    they load NULL, and is_active, source_table, source_load_ts and row_hash load
    the COMPANY values. The intended enum table is OUT OF SCOPE for SQL/KG
    equivalence until the correct export is supplied (column alignment review
    2026-10-05, point 5); do not claim it converted, and do not re-describe it as
    company data.

layer: "dimension"
grain: "one row per enum value"                     # [I]
not_null_columns: []                                # [D]
attribute_type_provenance: "inferred_per_section_11"
role: "documentary reference only - not linked to the columns it governs"
delivery_defect: "CSV is a byte-identical copy of dim_cmot_company_mstr.csv; intended enum table out of scope until a correct export is supplied (review 2026-10-05 point 5)"

semantics:
  business_purpose: >
    Generic key-value lookup for coded vocabularies. Not linked by foreign keys to
    the columns it governs, so it is documentary rather than enforcing; best used
    as a data-quality reference.

attributes:
  - name: "id"
    display_name: "ID"
    description: "[D] Integer surrogate."
    type: "integer"
    sql_type: "integer"
    nullable: true
    filterable: true
    attribute_type: "identifier"

  - name: "type_key"
    display_name: "Type Key"
    description: "[I] The CODE of the individual value within its enumeration."
    type: "string"
    sql_type: "varchar(256)"
    nullable: true
    filterable: true
    attribute_type: "identifier"

  - name: "master_category_name"
    display_name: "Master Category Name"
    description: "[I] Identifies WHICH enumeration a row belongs to."
    type: "string"
    sql_type: "varchar(256)"
    nullable: true
    filterable: true
    attribute_type: "dimension"

  - name: "name"
    display_name: "Name"
    description: "[I] The human-readable label to display."
    type: "string"
    sql_type: "varchar(256)"
    nullable: true
    filterable: true
    attribute_type: "dimension"

  - name: "master_type_key"
    display_name: "Master Type Key"
    description: "[I] The presence of TWO key-ish columns (type_key and master_type_key) suggests a two-level structure - a category grouping and a value key - but which is which is NOT determinable from the workbook. Run SELECT DISTINCT master_category_name, master_type_key first; it immediately reveals the intended layout. [C] Not checkable in this export: type_key, master_category_name and master_type_key load NULL on all 25 rows (see the table description)."
    type: "string"
    sql_type: "varchar(256)"
    nullable: true
    filterable: true
    attribute_type: "identifier"
    select_distinct_required: true

  - name: "is_active"
    display_name: "Is Active"
    description: "[D] Soft-delete pair lets retired enum values be hidden from pickers while remaining resolvable for historical rows - a genuinely useful property."
    type: "boolean"
    sql_type: "boolean"
    nullable: true
    filterable: true
    attribute_type: "dimension"
    three_valued: true

  - name: "is_deleted"
    display_name: "Is Deleted"
    description: "[D] Soft-delete pair, part 2."
    type: "boolean"
    sql_type: "boolean"
    nullable: true
    filterable: true
    attribute_type: "dimension"
    three_valued: true

  - name: "source_table"
    display_name: "Source Table"
    description: "[D] Lineage: name of the ORIGIN object in the SOURCE system, not this table. Proven by dim_client_master rows carrying 'clients'. Present in all 21 tables. NEVER join or filter business logic on this."
    type: "string"
    sql_type: "varchar(256)"
    nullable: true
    filterable: false
    attribute_type: "dimension"
    hidden: true

  - name: "source_load_ts"
    display_name: "Source Load Timestamp"
    description: "[D] ETL load timestamp, WITHOUT TIME ZONE - no timezone is recorded anywhere, so IST vs UTC is a convention held outside the DB. Present in 12 of 14 dim_* tables; absent from both MF history tables and from all 7 client_* facts."
    type: "timestamp"
    sql_type: "timestamp without time zone"
    nullable: true
    filterable: true
    attribute_type: "time_dimension"
    hidden: true

  - name: "row_hash"
    display_name: "Row Hash"
    description: "[D] 64-bit change-detection fingerprint; samples are 16 lowercase hex chars. Used for change-detecting upsert. Present in all 14 dim_* tables, none of the client_* facts. NEVER join on this."
    type: "string"
    sql_type: "varchar(256)"
    nullable: true
    filterable: false
    attribute_type: "dimension"
    hidden: true