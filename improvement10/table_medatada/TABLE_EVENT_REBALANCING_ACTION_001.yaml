# ATOM_EVENT_REBALANCING_ACTION_001 - V2 (Optimized for Primitive Selection)

identity:
  id: "ATOM_EVENT_REBALANCING_ACTION_001"
  type: "Atom"
  subtype: "Event"
  name: "rebalancing_action"
  display_name: "Rebalancing Action"

  description: >
    Time-stamped portfolio rebalancing action events. Captures buy/sell/hold
    recommendations generated by rebalancing logic. Each event represents an
    actionable step to align portfolio with target allocation.

semantics:
  business_purpose: >
    Captures portfolio rebalancing recommendations and actions. Enables tracking
    of buy/sell/hold decisions, allocation drift analysis, and rebalancing
    strategy execution.
  
  use_cases:
    - "rebalancing_tracking"
    - "allocation_drift_analysis"
    - "action_recommendations"
    - "portfolio_adjustment"
    - "compliance_audit"


attributes:
  - name: "rebalance_id"
    display_name: "Rebalance ID"
    synonyms: ["action ID"]
    description: "Unique identifier for each rebalancing action"
    type: "string"
    filterable: true

  - name: "investor_id"
    display_name: "Investor ID"
    synonyms: ["client ID"]
    description: "Foreign key to investor_profile"
    type: "string"
    filterable: true

  - name: "logic"
    display_name: "Logic"
    synonyms: ["reason", "rationale", "trigger logic"]
    description: "Observed reasoning or trigger logic behind the rebalancing action"
    type: "string"
    filterable: true
    searchable: true
    allowed_values:
      - "Manual Override"
      - "Valuation-based"
      - "Calendar-based"
      - "Momentum-driven"
      - "Mean-reversion"
      - "Threshold-based"
      - "Scenario-based"
      - "Tactical"
      - "Risk-parity"
      - "Automated Trigger"

  - name: "action"
    display_name: "Action"
    synonyms: ["recommendation", "trade action"]
    description: "Recommended action (Buy/Sell/Hold)"
    type: "string"
    filterable: true
    allowed_values:
      - "Buy"
      - "Sell"
      - "Hold"
      - "Goal Alignment Buy"
      - "Goal Alignment Sell"
      - "Profit Booking"
      - "Tactical Increase"
      - "Tactical Decrease"
      - "Rebalance Buy"
      - "Rebalance Sell"
      - "Sector Rotation Buy"
      - "Sector Rotation Sell"
      - "Switch In"
      - "Switch Out"
      - "Partial Exit"
      - "Stop Loss Exit"
      - "Defensive Shift"
      - "Aggressive Entry"
      - "Portfolio Trim"
      - "Cash Deployment"
      - "Asset Reallocation"
      - "Dividend Reinvestment"
      - "De-risking"



  - name: "current_allocation_pct"
    display_name: "Current Allocation"
    synonyms: ["current weight", "existing allocation"]
    description: "Current allocation percentage"
    type: "decimal"
    filterable: true
    aggregatable: true

  - name: "target_allocation_pct"
    display_name: "Target Allocation"
    synonyms: ["target weight", "desired allocation"]
    description: "Target allocation percentage"
    type: "decimal"
    filterable: true
    aggregatable: true

  - name: "amount"
    display_name: "Amount"
    synonyms: ["trade amount", "adjustment amount"]
    description: "Amount to buy/sell"
    type: "decimal"
    aggregatable: true
    filterable: true
    
  - name: "notes"
    display_name: "Notes"
    synonyms: ["comments", "remarks", "additional info"]
    description: "Free-form notes explaining the rebalancing action"
    type: "string"
    searchable: true

derived_attributes:
  - name: "allocation_drift"
    display_name: "Allocation Drift"
    description: "Difference between current and target allocation"

  - name: "drift_direction"
    display_name: "Drift Direction"
    description: "Whether allocation is overweight or underweight"
